_target_: models.mamba.MambaDeepfakeModel
n_mels: ${data.n_mels}
hop_length: ${data.hop_length}
n_layers: 2
d_model: 64
d_state: 16
d_conv: 4
expand: 2
dropout: 0.2

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.001
  weight_decay: 0.0005

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.1
  patience: 10