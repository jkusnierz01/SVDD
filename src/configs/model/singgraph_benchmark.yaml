_target_: models.singgraph.benchmark.SingGraphBenchmarkModel
feat_dim: 1024
num_windows: 30
enc_dim: 128
gat_dims: [64, 32]
pool_ratios: [0.5, 0.5, 0.5, 0.5]
temperatures: [2.0, 2.0, 100.0, 100.0]
num_nodes_s: 42
dropout: 0.5
drop_way: 0.2
label_smoothing: 0.0

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.01

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.1
  patience: 10
