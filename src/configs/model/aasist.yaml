_target_: models.legacy_singfake_system.AntiSpoofSystem

loss_fn:
  _target_: torch.nn.CrossEntropyLoss
  _partial_: true
  weight: [0.1, 0.9]

model_config:
  _target_: models.legacy_singfake_aasist.Model
  nb_samp: 64000 
  first_conv: 128
  filts: [70, [1, 32], [32, 32], [32, 64], [64, 64]]
  gat_dims: [64, 32]
  pool_ratios: [0.5, 0.7, 0.5, 0.5]
  temperatures: [2.0, 2.0, 100.0, 100.0]


optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001
  amsgrad: false

scheduler:
  type: "cosine"
  lr_min: 0.000005
  lr_max: ${optimizer.lr}
  
  